    <script type="module">
      import BASE_URL from "/Client/assets/js/config.js";



      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      async function fetchQuizDetails() {
        const contentId = getQueryParam("contentId");
        if (!contentId) {
          alert("Lesson ID is missing in the URL.");
          window.history.back();
          return;
        }

        try {
          const response = await fetch(
            `${BASE_URL}/test/details/content/${contentId}`,
            {
              headers: {
                Authorization: `Bearer ${localStorage.getItem("studentToken")}`,
              },
            }
          );
          const data = await response.json();

          if (!data) {
            alert("Quiz details could not be retrieved.");
            window.history.back();
            return;
          }

          document.getElementById("quizTitle").textContent =
            data.test.title || "Untitled Quiz";
          document.getElementById("quizDescription").textContent =
            data.test.description || "No description available.";
          document.getElementById("totalMarks").textContent = data.test.totalMarks;
          document.getElementById("timeLimit").textContent =
            data.test.timeLimit || "No limit";
          document.getElementById("maxAttempts").textContent =
            data.test.maxAttempts || "Unlimited";

          document.getElementById("startQuizButton").onclick = () =>
            startTest(data.test.id);
        } catch (error) {
          console.error("Error fetching quiz details:", error);
          alert("An error occurred while fetching quiz details.");
          window.history.back();
        }
      }

      async function startTest(testId) {
        try {
          const response = await fetch(`${BASE_URL}/test/start`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("studentToken")}`,
            },
            body: JSON.stringify({ test_id: testId }),
          });
          const result = await response.json();

          if (response.status === 201) {
            alert("Quiz started successfully!");
            window.location.href = `/Client/student-take-quiz.html?attemptId=${result.attempt._id}`;
          } else {
            alert(result.message || "Failed to start the quiz.");
          }
        } catch (error) {
          console.error("Error starting the quiz:", error);
          alert("An error occurred while starting the quiz.");
        }
      }

      window.onload = fetchQuizDetails;     
    </script>
