    <script type="module">
      import BASE_URL from "/Client/assets/js/config.js";
      // Get query parameters from URL
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      // Fetch Test Details by Attempt ID
      async function fetchTestDetails(attemptId) {
        try {
          const studentToken = localStorage.getItem("studentToken");
          if (!studentToken) {
            alert("You need to log in first.");
            window.location.href = "/login.html";
            return;
          }

          const response = await fetch(
            `${BASE_URL}/test/details/attempt/${attemptId}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${studentToken}`,
              },
            }
          );

          if (!response.ok) {
            alert("Failed to fetch test details. Try again.");
            return;
          }

          const data = await response.json();
          initializeTimer(data.attempt.startTime, data.test.timeLimit);
          renderQuiz(data.test, data.attempt);
        } catch (error) {
          console.error("Error fetching test details:", error);
          alert("An error occurred while loading the test. Please try again.");
        }
      }

      function initializeTimer(startTime, timeLimit) {
        const startTimestamp = new Date(startTime).getTime();
        const endTimestamp = startTimestamp + timeLimit * 60 * 1000; // Time limit in milliseconds

        function updateTimer() {
          const now = Date.now();
          const remainingTime = endTimestamp - now;

          if (remainingTime <= 0) {
            clearInterval(timerInterval);
            document.querySelector(".countdown").innerHTML = `
                <p class="pl-1 pr-1">
                  <span class="h5 text-danger">00</span> hrs 
                  <span class="h5 text-danger">00</span> min 
                  <span class="h5 text-danger">00</span> sec
                </p>`;
            alert("Time's up! Submitting the quiz automatically.");
            document.getElementById("submit-quiz").click(); // Auto-submit quiz
            return;
          }

          const hours = Math.floor(remainingTime / 3600000);
          const minutes = Math.floor((remainingTime % 3600000) / 60000);
          const seconds = Math.floor((remainingTime % 60000) / 1000);

          // Update the countdown element dynamically
          document.querySelector("#countdown").innerHTML = `
              <p class="pl-1 pr-1">
                <span class="h5 text-primary">${String(hours).padStart(
                  2,
                  "0"
                )}</span> hrs 
                <span class="h5 text-primary">${String(minutes).padStart(
                  2,
                  "0"
                )}</span> min 
                <span class="h5 text-primary">${String(seconds).padStart(
                  2,
                  "0"
                )}</span> sec
              </p>`;
        }

        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer(); // Call immediately to initialize
      }

      // Render the Quiz on the Page
      function renderQuiz(test, attempt) {
        const container = document.getElementById("quiz-container");
        container.innerHTML = ""; // Clear any existing content

        // Render Test Metadata
        const metadataHtml = `
                <div class="quiz-header">
                  <h2>${test.description}</h2>
                  <p><strong>Total Marks:</strong> ${test.totalMarks}</p>
                  <p><strong>Time Limit:</strong> ${test.timeLimit} minutes</p>
                  <p><strong>Maximum Attempts:</strong> ${test.maxAttempts}</p>
                </div>
              `;
        container.innerHTML += metadataHtml;

        // Render Questions
        test.questions.forEach((question, index) => {
          const questionHtml = `
                  <div class="card question-card" data-question-id="${
                    question.question_id
                  }">
                    <div class="card-body">
                      <h5 class="card-title">Q${index + 1}: ${
            question.question
          }</h5>
                      <div class="options">
                        ${question.options
                          .map(
                            (option, optIndex) => `
                            <div class="form-group">
                              <div class="custom-control custom-radio">
                                <input id="q${index}_option${optIndex}" type="radio" 
                                       name="question-${index}" 
                                       value="${option}" 
                                       class="custom-control-input">
                                <label for="q${index}_option${optIndex}" class="custom-control-label">${option}</label>
                              </div>
                            </div>
                          `
                          )
                          .join("")}
                      </div>
                    </div>
                  </div>
                `;
          container.innerHTML += questionHtml;
        });

        // Render Submit Button
        container.innerHTML += `
                <button id="submit-quiz" class="btn btn-primary mt-3">Submit Quiz</button>
              `;

        // Attach Submit Quiz Handler
        document
          .getElementById("submit-quiz")
          .addEventListener("click", () => submitQuiz(attempt.id));
      }

      // Submit Quiz Responses
      async function submitQuiz(attemptId) {
        const responses = [];
        const questions = document.querySelectorAll(".question-card");

        questions.forEach((question) => {
          const questionId = question.getAttribute("data-question-id");
          const selectedOption = question.querySelector(
            'input[type="radio"]:checked'
          );
          responses.push({
            question_id: questionId,
            response: selectedOption ? selectedOption.value : null,
          });
        });

        try {
          const studentToken = localStorage.getItem("studentToken");
          const response = await fetch(`${BASE_URL}/test/submit`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${studentToken}`,
            },
            body: JSON.stringify({ attempt_id: attemptId, responses }),
          });

          const result = await response.json();

          if (response.ok) {
            alert("Quiz submitted successfully!");
            window.location.href = `/Client/student-quiz-results.html?attemptId=${attemptId}`;
          } else {
            alert(result.message || "Failed to submit quiz.");
          }
        } catch (error) {
          console.error("Error submitting quiz:", error);
          alert(
            "An error occurred while submitting the quiz. Please try again."
          );
        }
      }

      // Load the Quiz on Page Load
      window.onload = () => {
        const attemptId = getQueryParam("attemptId");
        if (!attemptId) {
          alert("No attempt ID found. Redirecting to the course page.");
          window.location.href = "/student-take-course.html";
          return;
        }
        fetchTestDetails(attemptId);
      };
