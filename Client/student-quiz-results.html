        <script type="module">
            
            import BASE_URL from "/Client/assets/js/config.js";
            // Get query parameters from URL
            function getQueryParam(param) {
              const urlParams = new URLSearchParams(window.location.search);
              return urlParams.get("attemptId");
            }
          
            // Fetch Test Results and Render Them
            async function fetchTestResults(attemptId) {
              try {
                const studentToken = localStorage.getItem("studentToken");
                if (!studentToken) {
                  alert("You need to log in first.");
                  window.location.href = "/login.html";
                  return;
                }
          
                const response = await fetch(`${BASE_URL}/test/result/${attemptId}`, {
                  method: "GET",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${studentToken}`,
                  },
                });
          
                if (!response.ok) {
                  alert("Failed to fetch test details. Try again.");
                  return;
                }
          
                const data = await response.json();
                renderResults(data.test, data.attempt);
              } catch (error) {
                console.error("Error fetching test details:", error);
                alert("An error occurred while loading the test results. Please try again.");
              }
            }
          
            // Render Quiz Results on the Page
            function renderResults(test, attempt) {
              const resultContainer = document.getElementById("quiz-results-container");
              resultContainer.innerHTML = ""; // Clear any existing content
          
              // Render Test Metadata
              const metadataHtml = `
                <div class="result-header">
                  <h2>${test.description}</h2>
                  <p><strong>Total Marks:</strong> ${test.totalMarks}</p>
                  <p><strong>Time Limit:</strong> ${test.timeLimit} minutes</p>
                  <p><strong>Status:</strong> ${attempt.status}</p>
                </div>
              `;
              resultContainer.innerHTML += metadataHtml;
          
              // Render Score
              const scoreHtml = `
                <div class="card">
                  <div class="card-header">
                    <h4 class="card-title">Your Score</h4>
                  </div>
                  <div class="card-body">
                    <h4>${attempt.score} / ${test.totalMarks}</h4>
                  </div>
                </div>
              `;
              resultContainer.innerHTML += scoreHtml;
          
              // Render Questions and Answers
              const questionsHtml = test.questions
                .map((question, index) => {
                  const userResponse = attempt.responses.find(
                    (response) => response.question_id === question.question_id
                  );
                  const isCorrect = userResponse.response === question.correctAnswer;
          
                  return `
                    <li class="list-group-item">
                      <div class="media">
                        <div class="media-left">
                          <div class="text-muted-light">${index + 1}.</div>
                        </div>
                        <div class="media-body">
                          <p>${question.question}</p>
                          <p><strong>Your Answer:</strong> ${userResponse.response || "No Answer"}</p>
                          <p><strong>Correct Answer:</strong> ${question.correctAnswer}</p>
                        </div>
                        <div class="media-right">
                          <span class="badge badge-${isCorrect ? "success" : "danger"}">
                            ${isCorrect ? "Correct" : "Wrong"}
                          </span>
                        </div>
                      </div>
                    </li>
                  `;
                })
                .join("");
          
              resultContainer.innerHTML += `
                <div class="card">
                  <div class="card-header">
                    <h4 class="card-title">Questions and Answers</h4>
                  </div>
                  <ul class="list-group list-group-fit mb-0">${questionsHtml}</ul>
                </div>
              `;
            }
          
            // Load the Results on Page Load
            window.onload = () => {
              const attemptId = getQueryParam("attemptId");
              if (!attemptId) {
                alert("No attempt ID found. Redirecting to the course page.");
                window.location.href = "/student-take-course.html";
                return;
              }
              fetchTestResults(attemptId);
            };
          </script>
