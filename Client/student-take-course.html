  <script type="module">
    import BASE_URL from "/Client/assets/js/config.js";


    async function fetchCourse(id) {
      try {
        const response = await fetch(
          `${BASE_URL}/courses/${id}`,
          {
            headers: {
              Authorization: `Bearer ${localStorage.getItem("studentToken")}`,
            },
          }
        );
        const course = await response.json();
        document.getElementById("course-title").textContent = course.course.title
      } catch (err) {
        console.log(err);
      }
    }

    async function fetchModulesAndLessons() {
      const courseId = getCourseIdFromURL();
      const courseContainer = document.getElementById("courseContainer");
      fetchCourse(courseId)
      if (!courseId) {
        courseContainer.innerHTML =
          '<div class="alert alert-warning">Course ID is missing in the URL.</div>';
        return;
      }

      try {
        const response = await fetch(
          `${BASE_URL}/courses/${courseId}/modules-lessons`,
          {
            headers: {
              Authorization: `Bearer ${localStorage.getItem("studentToken")}`,
            },
          }
        );
        const modules = await response.json();

        if (modules.length === 0) {
          courseContainer.innerHTML =
            '<div class="alert alert-info">No modules available for this course.</div>';
          return;
        }

        courseContainer.innerHTML = ""; // Clear content
        modules.forEach((module) => {
          const accordion = document.createElement("div");
          accordion.className = "card";

          const header = document.createElement("div");
          header.className = "card-header";
          header.textContent = module.title;
          header.style.cursor = "pointer";
          header.onclick = () => {
            const body = header.nextElementSibling;
            body.classList.toggle("d-none");
          };

          const body = document.createElement("div");
          body.className = "card-body d-none";
          body.innerHTML = "<p>Loading lessons...</p>";

          accordion.appendChild(header);
          accordion.appendChild(body);
          courseContainer.appendChild(accordion);

          fetchLessons(module.module_id, body);
        });
      } catch (error) {
        console.error("Error fetching modules:", error);
        courseContainer.innerHTML =
          '<div class="alert alert-danger">Error loading course details. Please try again later.</div>';
      }
    }

    async function fetchLessons(moduleId, container) {
      try {
        const response = await fetch(
          `${BASE_URL}/lesson/modules/${moduleId}`,
          {
            headers: {
              Authorization: `Bearer ${localStorage.getItem("studentToken")}`,
            },
          }
        );
        const data = await response.json();

        if (data.lessons.length === 0) {
          container.innerHTML = "<p>No lessons available.</p>";
          return;
        }

        const ul = document.createElement("ul");
        ul.className = "list-group";
        data.lessons.forEach((lesson) => {
          const li = document.createElement("li");
          li.className = "list-group-item";

          const a = document.createElement("a");
          if (lesson.content && lesson.content.content_type === "PDF") {
            a.href = `/Client/showPdf.html?lessonId=${lesson._id}`;
          } else if (
            lesson.content &&
            lesson.content.content_type === "SCORM"
          ) {
            a.href = `${BASE_URL}/scorm/${lesson._id}/launch`;
          } else if (
            lesson.content &&
            lesson.content.content_type === "TestPaper"
          ) {
            a.href = `/Client/student-view-quiz.html?contentId=${lesson.content._id}`;
          } else {
            a.href = `#`; // Fallback
          }

          a.textContent = lesson.title;
          a.target = "_blank";
          li.appendChild(a);
          ul.appendChild(li);
        });

        container.innerHTML = "";
        container.appendChild(ul);
      } catch (error) {
        console.error("Error fetching lessons:", error);
        container.innerHTML =
          "<p>Error loading lessons. Please try again later.</p>";
      }
    }
    function getCourseIdFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get("courseId");
    }

    // Call the function on page load
    window.onload = fetchModulesAndLessons;
  </script>
