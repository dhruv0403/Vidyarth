    <script type="module">
      import BASE_URL from "/Client/assets/js/config.js";

      async function fetchStudentCourses() {
        try {
          const response = await fetch(`${BASE_URL}/learner/courses`, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("studentToken")}`,
            },
          });

          const data = await response.json();
          if (response.ok) {
            renderCourses(data);
          } else {
            console.error("Error fetching courses:", courses.message);
          }
        } catch (error) {
          console.error("Error fetching courses:", error);
        }
      }

      function renderCourses(data) {
        const container = document.querySelector(".card-columns");
        container.innerHTML = ""; // Clear existing content

        data.forEach((bundle) => {
          let course = bundle.course;
          const courseCard = document.createElement("div");
          courseCard.className = "card";

          courseCard.innerHTML = `
                    <div class="card-header">
                      <div class="media">
                        <div class="media-left">
                          <a href="student-take-course.html?courseId=${
                            course._id
                          }">
                            <img src="${
                              course.image_url || "assets/images/default.png"
                            }"
                                 alt="Course image"
                                 width="100"
                                 class="rounded">
                          </a>
                        </div>
                        <div class="media-body">
                          <h4 class="card-title m-0">
                            <a href="student-take-course.html?courseId=${
                              course._id
                            }">${course.title}</a>
                          </h4>
                          <small class="text-muted">Modules: ${
                            bundle.modules.length
                          }
                        </div>
                      </div>
                    </div>
                    <div class="progress rounded-0">
                      <div class="progress-bar progress-bar-striped bg-primary"
                           role="progressbar"
                           style="width: ${
                             (course.completedLessons / course.totalLessons) *
                             100
                           }%"
                           aria-valuenow="${
                             (course.completedLessons / course.totalLessons) *
                             100
                           }"
                           aria-valuemin="0"
                           aria-valuemax="100"></div>
                    </div>
                    <div class="card-footer bg-white">
                      <a href="student-take-course.html?courseId=${course._id}"
                         class="btn btn-primary btn-sm">
                         Continue <i class="material-icons btn__icon--right">play_circle_outline</i>
                      </a>
                    </div>
                  `;

          container.appendChild(courseCard);
        });
      }

      // Fetch and display courses on page load
      fetchStudentCourses();
