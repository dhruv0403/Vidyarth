<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Login</title>
    <!-- Custom Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Oswald:400,500,700%7CRoboto:400,500%7CRoboto:400,500&display=swap"
      rel="stylesheet"
    />
    <!-- Perfect Scrollbar -->
    <link
      type="text/css"
      href="assets/vendor/perfect-scrollbar.css"
      rel="stylesheet"
    />
    <!-- Material Design Icons -->
    <link
      type="text/css"
      href="assets/css/material-icons.css"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link type="text/css" href="assets/css/fontawesome.css" rel="stylesheet" />
    <!-- Preloader -->
    <link type="text/css" href="assets/vendor/spinkit.css" rel="stylesheet" />
    <!-- App CSS -->
    <link type="text/css" href="assets/css/app.css" rel="stylesheet" />
  </head>

  <body class="login">
    <div class="d-flex align-items-center" style="min-height: 100vh">
      <div class="col-sm-8 col-md-6 col-lg-4 mx-auto" style="min-width: 300px">
        <div class="text-center mt-5 mb-1">
          <div class="">
            <img
              style="width: 8rem"
              src="../Client/assets/images/logo/Vidyarthlogo.png"
              class="avatar-img"
              alt="Vidyarth"
            />
          </div>
        </div>

        <div class="card navbar-shadow">
          <div class="card-header text-center">
            <h4 class="card-title">Login</h4>
            <p class="card-subtitle">Access your account</p>
          </div>
          <div class="card-body">
            <form  novalidate method="get" id="login-form">
              <div class="form-group">
                <label class="form-label" for="email"
                  >Your email address:</label
                >
                <div class="input-group input-group-merge">
                  <input
                    id="email"
                    type="email"
                    required=""
                    class="form-control form-control-prepended"
                    placeholder="Your email address"
                  />
                  <div class="input-group-prepend">
                    <div class="input-group-text">
                      <span class="far fa-envelope"></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="password">Your password:</label>
                <div class="input-group input-group-merge">
                  <input
                    id="password"
                    type="password"
                    required=""
                    class="form-control form-control-prepended"
                    placeholder="Your password"
                  />
                  <div class="input-group-prepend">
                    <div class="input-group-text">
                      <span class="far fa-key"></span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">
                  Login
                </button>
              </div>
              <div class="text-center">
                <a
                  href="guest-forgot-password.html"
                  class="text-black-70"
                  style="text-decoration: underline"
                  >Forgot Password?</a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>


    <script type="module">
      import BASE_URL from "./assets/js/config.js";
    
      const loginForm = document.getElementById("login-form");
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
    
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
      
    
        try {
          const response = await fetch(`${BASE_URL}/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
          });
    
          const result = await response.json();
          if (response.ok) {    
            // Check user role and redirect accordingly
            const userRole = result.role; // Assuming the API returns `role` in the response
            if (userRole === "Admin") {
              localStorage.setItem("adminToken", result.token);
              setTimeout(() => {
                window.location.href = "/Client/admin-dashboard.html";
              }, 2000);
            } else if (userRole === "Learner") {
              localStorage.setItem("studentToken", result.token);
              setTimeout(() => {
                window.location.href = "/Client/student-my-courses.html";
              }, 2000);
            } else {
              statusElement.innerText = "Error: Unknown user role.";
              statusElement.style.color = "red";
            }
          } else {
            statusElement.innerText = `Error: ${result.message}`;
            statusElement.style.color = "red";
          }
        } catch (error) {
          console.error("Error during login:", error);
          statusElement.innerText = "Error: Unable to login. Please try again later.";
          statusElement.style.color = "red";
        }
      });
    </script>
    

    <!-- jQuery -->
    <script src="assets/vendor/jquery.min.js"></script>

    <!-- Bootstrap -->
    <script src="assets/vendor/popper.min.js"></script>
    <script src="assets/vendor/bootstrap.min.js"></script>

    <!-- Perfect Scrollbar -->
    <script src="assets/vendor/perfect-scrollbar.min.js"></script>

    <!-- MDK -->
    <script src="assets/vendor/dom-factory.js"></script>
    <script src="assets/vendor/material-design-kit.js"></script>

    <!-- App JS -->
    <script src="assets/js/app.js"></script>

    <!-- Highlight.js -->
    <script src="assets/js/hljs.js"></script>

    <!-- App Settings (safe to remove) -->
    
  </body>
</html>
